<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="항공권 데일리 스캐너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#4835C4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- 바탕 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 지구의 곡선 — "멀리 간다"는 느낌만 아주 옅게 -->
  <path d="M-30 452 A 300 300 0 0 1 542 452" fill="none"
        stroke="#fff" stroke-opacity=".14" stroke-width="26"/>

  <!-- 비행 궤적: 출발점에서 점선으로 이어진다 -->
  <path d="M96 400 C 168 348, 232 316, 292 268" fill="none"
        stroke="url(#sky)" stroke-width="18" stroke-linecap="round"
        stroke-dasharray="2 42"/>

  <!-- 출발 지점 -->
  <circle cx="96" cy="400" r="21" fill="#fff" fill-opacity=".95"/>
  <circle cx="96" cy="400" r="9" fill="#4835C4"/>

  <!-- 제트기: 오른쪽 위로 상승 -->
  <g transform="translate(316 202) rotate(43) scale(11.2) translate(-12 -12)">
    <path fill="#fff" d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9
             l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
  </g>
</svg>
