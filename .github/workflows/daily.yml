name: 항공권 데일리 스캔

on:
  schedule:
    # 07:00 KST = 22:00 UTC (전날). GitHub cron 은 UTC 기준.
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # price_history.json 커밋
  pages: write              # Pages 배포
  id-token: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 스캔 실행
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: |
          if [ -z "$TP_TOKEN" ]; then
            echo "::error::TP_TOKEN 시크릿이 비어 있습니다. Settings > Secrets > Actions 에서 등록하세요."
            exit 1
          fi
          python scanner.py

      - name: 결과 확인
        run: |
          test -f flight-deals/latest.html || { echo "::error::latest.html 이 생성되지 않았습니다"; exit 1; }
          python - <<'EOF'
          import json, sys
          b = json.load(open("flight-deals/state/brief.json", encoding="utf-8"))
          print(f"status={b['status']}  {b['headline']}")
          print("counts:", b["counts"])
          if b["status"] == "FAILED":
              print(f"::error::스캔 실패 — {b.get('reason')}")
              sys.exit(1)
          if b["status"] == "PARTIAL":
              print("::warning::기준을 넘는 딜이 없습니다 (정상일 수 있음)")
          EOF

      - name: 상태 파일 커밋
        run: |
          git config user.name  "flight-scanner"
          git config user.email "actions@github.com"
          git add flight-deals/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Pages 산출물 준비
        run: |
          mkdir -p public
          cp flight-deals/latest.html public/index.html
          cp flight-deals/state/brief.json public/brief.json
          mkdir -p public/archive
          cp -r flight-deals/archive/. public/archive/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
