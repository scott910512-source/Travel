name: 항공권 데일리 스캔

on:
  schedule:
    # 07:00 KST = 22:00 UTC (전날). GitHub cron 은 UTC 기준.
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼
  push:                     # 화면(web/) 만 고쳐도 바로 반영되도록
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write           # price_history.json 커밋
  pages: write              # Pages 배포
  id-token: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # 응답 지연으로 러너가 매달리는 것 방지
    outputs:
      scanned: ${{ steps.mode.outputs.scan }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # web/ 만 바뀐 push 는 API 를 다시 때리지 않는다.
      # 이미 레포에 있는 deals.json 을 그대로 쓰고 화면만 재배포한다.
      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f flight-deals/state/deals.json ]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "web/ 변경 → 스캔 생략, 기존 데이터로 재배포"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 스캔 실행
        if: steps.mode.outputs.scan == 'true'
        env:
          # TP_TOKEN 은 필수. 나머지는 선택 — 없으면 그 provider 만 꺼진다.
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
        run: |
          if [ -z "$TP_TOKEN" ]; then
            echo "::error::TP_TOKEN 시크릿이 비어 있습니다. Settings > Secrets > Actions 에서 등록하세요."
            exit 1
          fi
          # 부가 provider 의 토큰이 없다고 워크플로를 실패시키지 않는다.
          [ -z "$DUFFEL_TOKEN" ] && echo "::notice::DUFFEL_TOKEN 없음 — Duffel provider 비활성"
          [ -z "$SKYSCANNER_API_KEY" ] && echo "::notice::SKYSCANNER_API_KEY 없음 — Skyscanner provider 비활성"
          python scanner.py --ab

      - name: 결과 확인
        run: |
          test -f flight-deals/state/deals.json || { echo "::error::deals.json 이 없습니다"; exit 1; }
          python - <<'EOF'
          import json, sys
          d = json.load(open("flight-deals/state/deals.json", encoding="utf-8"))
          b = json.load(open("flight-deals/state/brief.json", encoding="utf-8"))
          print(f"schema={d['schema']} offers={len(d['offers'])} routes={len(d['routes'])}")
          print(f"status={b['status']}  {b['headline']}")
          print("counts:", b["counts"])
          for k in ("meta", "routes", "offers", "access_cost_default"):
              if k not in d:
                  print(f"::error::deals.json 에 {k} 가 없습니다"); sys.exit(1)
          if b["status"] == "FAILED":
              print(f"::error::스캔 실패 — {b.get('reason')}"); sys.exit(1)
          if b["status"] == "PARTIAL":
              print("::warning::비교 가능한 항공권이 없습니다 (정상일 수 있음)")
          EOF

      - name: 커버리지 요약
        if: steps.mode.outputs.scan == 'true'
        run: |
          python - <<'EOF'
          import json, os
          p = "flight-deals/state/candidate.json"
          if not os.path.exists(p):
              print("candidate.json 없음 — 커버리지 요약 생략"); raise SystemExit
          c = json.load(open(p, encoding="utf-8"))
          print("| 지표 | 값 |"); print("|---|---|")
          for k in ("offers_total", "cjj_valid_offers", "cjj_zero_routes",
                    "cjj_priced_destinations", "zrh_offers", "zrh_direct", "zrh_1stop"):
              print(f"| {k} | {c.get(k)} |")
          if c.get("cjj_zero_list"):
              print(f"\n0건 노선: {', '.join(c['cjj_zero_list'])}")
          EOF

      - name: 상태 파일 커밋
        if: steps.mode.outputs.scan == 'true'
        run: |
          git config user.name  "flight-scanner"
          git config user.email "actions@github.com"
          git add flight-deals/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "scan $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pages 산출물 = 정적 앱(web/) + 데이터(deals.json, brief.json)
      - name: Pages 산출물 준비
        run: |
          mkdir -p public
          cp web/index.html web/app.css web/app.js public/
          cp web/icon.svg web/icon-32.png web/icon-180.png \
             web/icon-192.png web/icon-512.png public/
          cp web/manifest.webmanifest public/
          cp flight-deals/state/deals.json public/deals.json
          cp flight-deals/state/brief.json public/brief.json
          ls -la public
          echo "deals.json $(du -h public/deals.json | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
