name: 항공권 스캔 (6시간마다)

on:
  schedule:
    # 6시간마다. GitHub cron 은 UTC 기준이라 KST-9 로 적는다.
    #   22 UTC → 07:00 KST (다음날)
    #   04 UTC → 13:00 KST
    #   10 UTC → 19:00 KST
    #   16 UTC → 01:00 KST
    # 캐시(2~7일 보관)가 6시간마다 확 바뀌지는 않는다. 노리는 건 "값이
    # 잠깐 떴다 사라지는 것" 을 놓치지 않는 것과, 가격의 나이를 24시간이
    # 아니라 6시간 이내로 유지하는 것이다.
    - cron: "0 22,4,10,16 * * *"
  workflow_dispatch:        # 수동 실행 버튼
  pull_request:             # PR 은 검증만 (배포 안 함)
  push:
    branches: ["**"]        # 검증은 모든 브랜치에서, 배포는 운영 브랜치만
    paths:
      - "web/**"
      - "core/**"
      - "sources/**"
      - "tests/**"
      - "scanner.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write           # price_history.json 커밋
  pages: write              # Pages 배포
  id-token: write

concurrency:
  group: flight-scan-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # ★ 운영 배포 브랜치. 이 레포에는 main 이 없다 — 원격 브랜치가 하나뿐이고
  #   GitHub Pages 가 그 브랜치의 워크플로 실행에서 배포된다. 'main' 이라고
  #   가정하면 배포가 통째로 멈춘다.
  #   다른 브랜치·PR 에서는 검증만 하고 배포하지 않는다.
  PROD_BRANCH: claude/file-creation-execution-iqjo4z

jobs:
  # 배포 전에 반드시 통과해야 하는 검증. 어느 브랜치에서든 돈다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript 구문 검사
        run: |
          node --check web/app.js
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8'))"

      - name: Python 구문 검사
        run: python -m compileall -q scanner.py core sources

      - name: 테스트
        run: |
          fail=0
          for f in tests/test_*.py; do
            if python "$f" > /tmp/out.txt 2>&1; then
              echo "✅ $f"
            else
              echo "❌ $f"; cat /tmp/out.txt; fail=1
            fi
          done
          exit $fail

      - name: 데이터 스키마 검증
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("flight-deals/state/deals.json", encoding="utf-8"))
          b = json.load(open("flight-deals/state/brief.json", encoding="utf-8"))
          need = ("schema", "meta", "routes", "offers", "access_cost_default",
                  "home", "stats")
          for k in need:
              if k not in d:
                  print(f"::error::deals.json 에 {k} 가 없습니다"); sys.exit(1)
          if not isinstance(d["offers"], list):
              print("::error::offers 가 리스트가 아닙니다"); sys.exit(1)
          for k in ("status", "headline", "counts"):
              if k not in b:
                  print(f"::error::brief.json 에 {k} 가 없습니다"); sys.exit(1)
          print(f"schema={d['schema']} offers={len(d['offers'])} status={b['status']}")
          EOF

      - name: 토큰이 산출물에 섞이지 않았는지
        run: |
          # 프런트엔드·데이터 파일에 토큰이 들어가면 안 된다.
          if grep -rInE '(TP_TOKEN|DUFFEL_TOKEN|SKYSCANNER_API_KEY)[^A-Z_]*[:=][[:space:]]*["'"'"'][A-Za-z0-9]{8,}' \
               web/ flight-deals/state/ 2>/dev/null; then
            echo "::error::산출물에 토큰처럼 보이는 값이 있습니다"; exit 1
          fi
          if grep -qE 'DEFAULT_TOKEN\s*=\s*["'"'"'][A-Za-z0-9]' scanner.py; then
            echo "::error::scanner.py 의 DEFAULT_TOKEN 이 비어 있지 않습니다"; exit 1
          fi
          echo "토큰 노출 없음"

  scan:
    needs: verify
    # ★ 운영 브랜치가 아니면 API 를 때리지도, 배포하지도 않는다.
    #   다른 브랜치·PR 은 verify 까지만 돈다.
    if: github.ref_name == 'claude/file-creation-execution-iqjo4z' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30      # 응답 지연으로 러너가 매달리는 것 방지
    outputs:
      scanned: ${{ steps.mode.outputs.scan }}
    steps:
      # 얕은 클론이면 아래 "상태 파일 커밋" 의 리베이스가 실패한다.
      # 레포 전체가 7MB 라 전체를 받아도 싸다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # web/ 만 바뀐 push 는 API 를 다시 때리지 않는다.
      # 이미 레포에 있는 deals.json 을 그대로 쓰고 화면만 재배포한다.
      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f flight-deals/state/deals.json ]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "web/ 변경 → 스캔 생략, 기존 데이터로 재배포"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi
          echo "브랜치=${{ github.ref_name }} (운영=${PROD_BRANCH})"

      - name: 스캔 실행
        if: steps.mode.outputs.scan == 'true'
        env:
          # TP_TOKEN 은 필수. 나머지는 선택 — 없으면 그 provider 만 꺼진다.
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
        run: |
          if [ -z "$TP_TOKEN" ]; then
            echo "::error::TP_TOKEN 시크릿이 비어 있습니다. Settings > Secrets > Actions 에서 등록하세요."
            exit 1
          fi
          # 부가 provider 의 토큰이 없다고 워크플로를 실패시키지 않는다.
          [ -z "$DUFFEL_TOKEN" ] && echo "::notice::DUFFEL_TOKEN 없음 — Duffel provider 비활성"
          [ -z "$SKYSCANNER_API_KEY" ] && echo "::notice::SKYSCANNER_API_KEY 없음 — Skyscanner provider 비활성"
          python scanner.py --ab

      - name: 결과 확인
        run: |
          test -f flight-deals/state/deals.json || { echo "::error::deals.json 이 없습니다"; exit 1; }
          python - <<'EOF'
          import json, sys
          d = json.load(open("flight-deals/state/deals.json", encoding="utf-8"))
          b = json.load(open("flight-deals/state/brief.json", encoding="utf-8"))
          print(f"schema={d['schema']} offers={len(d['offers'])} routes={len(d['routes'])}")
          print(f"status={b['status']}  {b['headline']}")
          print("counts:", b["counts"])
          for k in ("meta", "routes", "offers", "access_cost_default"):
              if k not in d:
                  print(f"::error::deals.json 에 {k} 가 없습니다"); sys.exit(1)
          if b["status"] == "FAILED":
              print(f"::error::스캔 실패 — {b.get('reason')}"); sys.exit(1)
          if b["status"] == "PARTIAL":
              print("::warning::비교 가능한 항공권이 없습니다 (정상일 수 있음)")
          EOF

      - name: 커버리지 요약
        if: steps.mode.outputs.scan == 'true'
        run: |
          python - <<'EOF'
          import json, os
          p = "flight-deals/state/candidate.json"
          if not os.path.exists(p):
              print("candidate.json 없음 — 커버리지 요약 생략"); raise SystemExit
          c = json.load(open(p, encoding="utf-8"))
          print("| 지표 | 값 |"); print("|---|---|")
          for k in ("offers_total", "cjj_valid_offers", "cjj_zero_routes",
                    "cjj_priced_destinations", "zrh_offers", "zrh_direct", "zrh_1stop"):
              print(f"| {k} | {c.get(k)} |")
          if c.get("cjj_zero_list"):
              print(f"\n0건 노선: {', '.join(c['cjj_zero_list'])}")
          EOF

      # 하루 4번 돌면 사람이 밀어 넣은 커밋과 부딪힐 확률도 4배가 된다.
      # 예전에는 push 가 한 번 밀리면 스텝이 죽고 deploy 까지 건너뛰었다.
      # 리베이스로 두 번 더 시도하고, 그래도 안 되면 커밋만 포기한다 —
      # 데이터는 이미 파일에 있으니 배포는 계속해야 한다.
      - name: 상태 파일 커밋
        if: steps.mode.outputs.scan == 'true'
        run: |
          git config user.name  "flight-scanner"
          git config user.email "actions@github.com"
          git add flight-deals/
          if git diff --staged --quiet; then
            echo "변경 없음"; exit 0
          fi
          # 하루 4번이라 날짜만으로는 구분이 안 된다. 시각까지 적는다.
          git commit -m "scan $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do
            if git push; then
              echo "push 성공 (${i}회차)"; exit 0
            fi
            echo "::notice::push 실패 ${i}회차 — 리베이스 후 재시도"
            git pull --rebase origin "${GITHUB_REF_NAME}" || break
            sleep $((i * 3))
          done
          echo "::warning::상태 파일을 푸시하지 못했습니다. 배포는 계속합니다 \
          (이번 결과는 다음 실행에서 다시 커밋됩니다)"

      # Pages 산출물 = 정적 앱(web/) + 데이터(deals.json, brief.json)
      # ★ 캐시 무력화. app.js 에 버전이 안 붙어 있으면 기기가 옛 파일을
      #   계속 쓴다. UI 전체가 app.js 안에 있으므로 그게 곧 "과거 화면" 이
      #   된다. deals.json 은 no-cache 로 받으니 데이터만 최신이고 화면은
      #   옛것인 상태가 되어 원인을 찾기 어렵다.
      #   GitHub Pages 는 max-age=600 을 주는데, iOS 홈 화면 앱은 그보다
      #   훨씬 오래 붙들고 있는다. 배포마다 URL 이 바뀌어야 확실하다.
      - name: Pages 산출물 준비
        run: |
          mkdir -p public
          cp web/index.html web/app.css web/app.js public/
          BUILD="${GITHUB_SHA::7}"
          sed -i "s|href=\"app.css\"|href=\"app.css?v=${BUILD}\"|" public/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${BUILD}\"|"   public/index.html
          sed -i "s|__BUILD__|${BUILD}|"                            public/index.html
          echo "빌드 ${BUILD}"
          grep -E 'app\.(js|css)' public/index.html
          cp web/icon.svg web/icon-32.png web/icon-180.png \
             web/icon-192.png web/icon-512.png public/
          cp web/manifest.webmanifest public/
          cp flight-deals/state/deals.json public/deals.json
          cp flight-deals/state/brief.json public/brief.json
          ls -la public
          echo "deals.json $(du -h public/deals.json | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    # 운영 브랜치에서만. scan 이 이미 걸러 내지만 여기서도 한 번 더 막는다 —
    # 배포는 되돌리기 어려우므로 조건을 한 곳에만 두지 않는다.
    if: github.ref_name == 'claude/file-creation-execution-iqjo4z' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
